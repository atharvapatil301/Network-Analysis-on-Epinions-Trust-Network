# AWS Configuration for Opinion Simulation Project
# Replace with your actual AWS credentials and settings

# AWS Credentials (DO NOT commit actual credentials to git)
aws.access.key.id=YOUR_AWS_ACCESS_KEY_ID
aws.secret.access.key=YOUR_AWS_SECRET_ACCESS_KEY
aws.region=us-east-1

# S3 Configuration
s3.bucket.name=cs6240-opinion-simulation
s3.input.path=s3://cs6240-opinion-simulation/input/
s3.output.path=s3://cs6240-opinion-simulation/output/
s3.jar.path=s3://cs6240-opinion-simulation/jars/

# EMR Cluster Configuration
emr.cluster.name=OpinionSimulationCluster
emr.release.label=emr-6.15.0
emr.instance.type.master=m5.xlarge
emr.instance.type.core=m5.xlarge
emr.instance.count.core=2
emr.log.uri=s3://cs6240-opinion-simulation/logs/

# EC2 Configuration
ec2.key.name=your-ec2-keypair
ec2.subnet.id=subnet-xxxxxxxx

# Application Configuration
spark.executor.memory=4g
spark.executor.cores=2
spark.driver.memory=2g
spark.default.parallelism=8
